[project]
name = "ppi-redactor"
version = "0.1.0"
description = "Local clipboard PII redactor backed by openai/privacy-filter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]

[project.optional-dependencies]
mac = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.scripts]
ppi-redactor = "ppi_redactor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppi_redactor"]
